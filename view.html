<script>
  // ── Storage helpers ──
  async function loadRecipes() {
    try {
      const { value } = await Capacitor.Plugins.Preferences.get({ key: 'pear_recipes' });
      return value ? JSON.parse(value) : [];
    } catch { return []; }
  }
  async function saveRecipes(recipes) {
    try {
      await Capacitor.Plugins.Preferences.set({ key: 'pear_recipes', value: JSON.stringify(recipes) });
    } catch {}
  }

  const nav = document.getElementById('mainNav');
  window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20), { passive: true });

  let allRecipes = [];
  let currentRecipeTitle = null;

  function formatDate(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch { return ''; }
  }

  function renderGrid(recipes) {
    const grid  = document.getElementById('recipeGrid');
    const empty = document.getElementById('emptyState');
    if (!recipes.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = recipes.map(r => `
      <div class="recipe-tile" onclick="openRecipe('${r.title.replace(/'/g, "\\'")}')">
        ${r.image
          ? `<img class="recipe-tile-img" src="${r.image}" alt="${r.title}">`
          : `<div class="recipe-tile-img-placeholder"><span class="material-symbols-rounded">restaurant</span></div>`
        }
        <div class="recipe-tile-body">
          <div class="recipe-tile-title">${r.title}</div>
          <div class="recipe-tile-desc">${r.description || ''}</div>
          ${r.saved_at ? `<div class="recipe-tile-date"><span class="material-symbols-rounded">calendar_today</span>${formatDate(r.saved_at)}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openRecipe(title) {
    const recipe = allRecipes.find(r => r.title === title);
    if (!recipe) return;
    currentRecipeTitle = title;

    // image
    const img = document.getElementById('modalImage');
    if (recipe.image) {
      img.src = recipe.image;
      img.style.display = 'block';
    } else {
      img.style.display = 'none';
    }

    document.getElementById('modalTitle').textContent = recipe.title;
    document.getElementById('modalDesc').textContent  = recipe.description || '';

    // ingredients
    const ingredients = Array.isArray(recipe.ingredients)
      ? recipe.ingredients
      : recipe.ingredients.split(',').map(s => s.trim());
    document.getElementById('modalIngredients').innerHTML =
      ingredients.map(i => `<span class="ingredient-pill">${i}</span>`).join('');

    // steps
    const procedures = Array.isArray(recipe.procedures)
      ? recipe.procedures
      : recipe.procedures.split(',').map(s => s.trim());
    document.getElementById('modalSteps').innerHTML =
      procedures.map((p, n) => `
        <div class="step">
          <div class="step-num">${n + 1}</div>
          <div class="step-text">${p}</div>
        </div>`).join('');

    // nutrition
    const nutWrap = document.getElementById('modalNutritionWrap');
    const nutGrid = document.getElementById('modalNutrition');
    if (recipe.nutrition && typeof recipe.nutrition === 'object') {
      nutGrid.innerHTML = Object.entries(recipe.nutrition).map(([key, val]) => {
        const label = key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, s => s.toUpperCase());
        return `<div class="nutrition-cell">
          <span class="nut-val">${val}</span>
          <span class="nut-key">${label}</span>
        </div>`;
      }).join('');
      nutWrap.style.display = 'block';
    } else {
      nutWrap.style.display = 'none';
    }

    document.getElementById('modalOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  async function deleteCurrentRecipe() {
    if (!currentRecipeTitle) return;
    if (!confirm(`Delete "${currentRecipeTitle}"?`)) return;
    allRecipes = allRecipes.filter(r => r.title !== currentRecipeTitle);
    await saveRecipes(allRecipes);
    closeModal();
    renderGrid(allRecipes);
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
    document.body.style.overflow = '';
    currentRecipeTitle = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  window.onload = async function () {
    allRecipes = await loadRecipes();
    renderGrid(allRecipes);
  };
</script>
