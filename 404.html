<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Pear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">

  <style>
    :root {
      --green:     #2d6a2a;
      --green-mid: #48a044;
      --green-lt:  #b6ddb3;
      --green-xs:  #e8f5e6;
      --cream:     #f7f9f4;
      --white:     #ffffff;
      --text:      #1a241a;
      --text-mid:  #4a5e48;
      --text-lt:   #7a9278;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated background blobs ── */
    .bg-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-blob {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.22;
    }
    .bb1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #48a044, transparent 70%);
      top: -180px; left: -120px;
      animation: drift1 14s ease-in-out infinite alternate;
    }
    .bb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #a8d870, transparent 70%);
      bottom: -100px; right: -80px;
      animation: drift2 18s ease-in-out infinite alternate;
    }
    .bb3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #f0a500, transparent 70%);
      bottom: 100px; left: 20%;
      animation: drift3 22s ease-in-out infinite alternate;
      opacity: 0.12;
    }
    @keyframes drift1 { from { transform: translate(0,0) scale(1); }   to { transform: translate(30px, 40px) scale(1.06); } }
    @keyframes drift2 { from { transform: translate(0,0) scale(1); }   to { transform: translate(-25px,-30px) scale(1.04); } }
    @keyframes drift3 { from { transform: translate(0,0); }            to { transform: translate(20px,-20px); } }

    /* ── Floating leaf particles ── */
    .leaf {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 50% 0 50% 0;
      background: var(--green-mid);
      opacity: 0;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg);  opacity: 0; }
      10%  { opacity: 0.35; }
      90%  { opacity: 0.18; }
      100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative; z-index: 1;
      background: var(--white);
      border: 1.5px solid var(--green-lt);
      border-radius: 32px;
      padding: 56px 64px 52px;
      max-width: 540px; width: calc(100% - 48px);
      text-align: center;
      box-shadow: 0 24px 80px rgba(45,106,42,.10), 0 1px 4px rgba(0,0,0,.04);
      animation: card-in .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(32px) scale(.96); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Logo ── */
    .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 36px;
      animation: fade-down .5s .1s ease both;
    }
    .logo-img {
      width: 42px; height: 42px; border-radius: 50%;
      box-shadow: 0 6px 20px rgba(45,106,42,.2);
    }
    .logo-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.55rem; font-weight: 900;
      color: var(--green); letter-spacing: -.03em;
    }

    /* ── 404 display ── */
    .four-oh-four {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 900;
      letter-spacing: -.05em;
      line-height: 1;
      color: var(--green);
      margin-bottom: 6px;
      animation: fade-down .5s .18s ease both;
      position: relative;
      display: inline-block;
    }
    .four-oh-four::after {
      content: '404';
      position: absolute;
      inset: 0;
      color: var(--green-lt);
      z-index: -1;
      transform: translate(3px, 4px);
      filter: blur(0px);
    }

    /* ── Pear icon in the zero ── */
    .zero-pear {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .headline {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.35rem; font-weight: 800;
      color: var(--text);
      letter-spacing: -.02em;
      margin-bottom: 10px;
      animation: fade-down .5s .25s ease both;
    }

    .subline {
      font-size: .93rem;
      color: var(--text-lt);
      line-height: 1.65;
      max-width: 340px;
      margin: 0 auto 36px;
      animation: fade-down .5s .32s ease both;
    }

    /* ── Progress section ── */
    .redirect-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-mid);
      animation: fade-down .5s .38s ease both;
    }
    .redirect-info .material-symbols-rounded {
      font-size: 16px; color: var(--green-mid);
      animation: spin-slow 3s linear infinite;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }

    .countdown-num {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 900;
      font-size: .9rem;
      line-height: 1;
      flex-shrink: 0;
      transition: transform .15s ease;
    }
    .countdown-num.tick {
      animation: pop .25s ease;
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--green-xs);
      border: 1.5px solid var(--green-lt);
      border-radius: 9999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 28px;
      animation: fade-down .5s .44s ease both;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--green-mid), var(--green));
      width: 0%;
      transition: width .05s linear;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 24px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4));
      border-radius: 9999px;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 10px; justify-content: center;
      flex-wrap: wrap;
      animation: fade-down .5s .5s ease both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 12px 24px; border-radius: 9999px;
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .9rem;
      cursor: pointer; border: none; text-decoration: none;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn .material-symbols-rounded { font-size: 17px; }
    .btn-primary {
      background: var(--green); color: #fff;
      box-shadow: 0 4px 20px rgba(45,106,42,.28);
    }
    .btn-primary:hover { background: #256022; box-shadow: 0 8px 28px rgba(45,106,42,.38); transform: translateY(-1px); }
    .btn-ghost {
      background: var(--white); color: var(--text-mid);
      border: 1.5px solid var(--green-lt);
    }
    .btn-ghost:hover { border-color: var(--green-mid); transform: translateY(-1px); background: var(--green-xs); }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Pear illustration ── */
    .pear-wrap {
      margin-bottom: 20px;
      animation: float-pear 5s ease-in-out infinite, fade-down .5s .08s ease both;
    }
    .pear-svg { filter: drop-shadow(0 8px 20px rgba(45,106,42,.2)); }

    @keyframes float-pear {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%       { transform: translateY(-10px) rotate(2deg); }
    }

    /* ── Done state ── */
    .done-flash {
      position: fixed; inset: 0; z-index: 999;
      background: var(--green-xs);
      opacity: 0; pointer-events: none;
      animation: none;
    }
    .done-flash.go {
      animation: flash-out .5s ease forwards;
    }
    @keyframes flash-out {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="done-flash" id="doneFlash"></div>

<div class="bg-canvas">
  <div class="bg-blob bb1"></div>
  <div class="bg-blob bb2"></div>
  <div class="bg-blob bb3"></div>
</div>

<div class="card">

  <div class="logo-row">
    <img class="logo-img" src="https://kidslearninglab.com/pear%201.png" alt="Pear">
    <span class="logo-name">Pear</span>
  </div>

  <div class="four-oh-four">404</div>

  <h1 class="headline">Page not found</h1>
  <p class="subline">Looks like this page took a wrong turn somewhere in the garden. Let's get you back to your kitchen.</p>

  <div class="redirect-info">
    <span class="material-symbols-rounded">refresh</span>
    Redirecting to home in
    <span class="countdown-num" id="countNum">5</span>
    second<span id="pluralS">s</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="btn-row">
    <a href="index.html" class="btn btn-primary">
      <span class="material-symbols-rounded">home</span>
      Go Home Now
    </a>
    <button class="btn btn-ghost" onclick="cancelRedirect()">
      <span class="material-symbols-rounded">close</span>
      Cancel
    </button>
  </div>

</div>

<!-- Leaf particles -->
<script>
  // Spawn floating leaves
  for (let i = 0; i < 12; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.cssText = `
      left: ${Math.random() * 100}vw;
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      animation-duration: ${8 + Math.random() * 14}s;
      animation-delay: ${Math.random() * 12}s;
      opacity: 0;
      transform: rotate(${Math.random() * 360}deg);
    `;
    document.body.appendChild(leaf);
  }

  // Countdown + progress bar
  const TOTAL = 5;
  let remaining = TOTAL;
  let cancelled = false;
  let startTime = null;
  let rafId = null;

  const fill   = document.getElementById('progressFill');
  const numEl  = document.getElementById('countNum');
  const plural = document.getElementById('pluralS');
  const flash  = document.getElementById('doneFlash');

  function tick(ts) {
    if (cancelled) return;
    if (!startTime) startTime = ts;

    const elapsed = (ts - startTime) / 1000; // seconds
    const pct = Math.min((elapsed / TOTAL) * 100, 100);
    fill.style.width = pct + '%';

    const newRemaining = Math.max(0, Math.ceil(TOTAL - elapsed));
    if (newRemaining !== remaining) {
      remaining = newRemaining;
      numEl.textContent = remaining;
      plural.textContent = remaining === 1 ? '' : 's';
      // Pop animation
      numEl.classList.remove('tick');
      void numEl.offsetWidth; // reflow
      numEl.classList.add('tick');
    }

    if (elapsed >= TOTAL) {
      // Flash and redirect
      flash.classList.add('go');
      setTimeout(() => { window.location.href = 'index.html'; }, 350);
      return;
    }

    rafId = requestAnimationFrame(tick);
  }

  rafId = requestAnimationFrame(tick);

  window.cancelRedirect = function() {
    cancelled = true;
    cancelAnimationFrame(rafId);
    // Freeze UI
    fill.style.transition = 'none';
    document.querySelector('.redirect-info').innerHTML =
      '<span class="material-symbols-rounded" style="color:var(--text-lt);animation:none">block</span>' +
      '<span style="color:var(--text-lt)">Redirect cancelled</span>';
  };
</script>

</body>
</html>
