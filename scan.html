<!-- <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pear · Scan a Recipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
.page {
  position: absolute;
  width: 100%;
  transition: opacity 0.25s ease;
}

.page-enter {
  opacity: 0;
}

.page-enter-active {
  opacity: 1;
}

    :root {
      --green:     #2d6a2a;
      --green-mid: #48a044;
      --green-lt:  #b6ddb3;
      --green-xs:  #e8f5e6;
      --cream:     #f7f9f4;
      --white:     #ffffff;
      --text:      #1a241a;
      --text-mid:  #4a5e48;
      --text-lt:   #7a9278;
      --r-sm:      10px;
      --r-md:      18px;
      --r-lg:      28px;
      --r-full:    9999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream); color: var(--text);
      overflow-x: hidden; min-height: 100vh;
    }

    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      font-size: 20px; line-height: 1; vertical-align: middle; user-select: none;
    }

    .bg-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-circle {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, var(--c) 0%, transparent 70%);
      opacity: .17; animation: drift 16s ease-in-out infinite alternate;
    }
    .bc1 { --c: #48a044; width: 600px; height: 600px; top: -200px; left: -150px; }
    .bc2 { --c: #a8d870; width: 400px; height: 400px; top: 50%; right: -100px; animation-delay: -5s; }
    .bc3 { --c: #f0a500; width: 300px; height: 300px; bottom: 0; left: 25%; animation-delay: -10s; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(25px,35px); } }

    nav {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 32px 16px;
      background: rgba(247,249,244,.82);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: padding .25s, box-shadow .25s, background .25s;
    }
    nav.scrolled {
      padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px;
      background: rgba(247,249,244,.94);
      box-shadow: 0 1px 0 rgba(0,0,0,.07), 0 4px 24px rgba(0,0,0,.05);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 800;
      color: var(--green); text-decoration: none;
    }
    .logo img { width: 38px; height: 38px; border-radius: 50%; }
    .nav-links { display: flex; gap: 4px; background: var(--green-xs); padding: 4px; border-radius: var(--r-full); }
    .nav-links a {
      padding: 7px 18px; border-radius: var(--r-full);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: .88rem;
      color: var(--text-mid); text-decoration: none;
      transition: background .18s, color .18s;
    }
    .nav-links a:hover { color: var(--green); }
    .nav-links a.active { background: var(--white); color: var(--green); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    .page-header {
      position: relative; z-index: 1;
      max-width: 980px; margin: 28px auto 0; padding: 0 48px 40px;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--white); border: 1.5px solid var(--green-lt);
      color: var(--green); border-radius: var(--r-full);
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .8rem;
      padding: 5px 14px 5px 8px; margin-bottom: 20px;
      letter-spacing: .03em; text-transform: uppercase;
    }
    .hero-badge .material-symbols-rounded { font-size: 16px; color: var(--green-mid); }
    .page-header h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem); font-weight: 900;
      line-height: 1.08; letter-spacing: -.03em; margin-bottom: 12px;
    }
    .page-header h1 em { font-style: normal; color: var(--green); }
    .page-header p { color: var(--text-mid); font-size: .97rem; line-height: 1.65; max-width: 580px; }
    .notice {
      display: flex; align-items: center; gap: 8px;
      background: #fff8e6; border: 1.5px solid #f0c84a; border-radius: var(--r-md);
      padding: 10px 14px; font-size: .85rem; color: #7a5a00; margin-top: 14px;
      max-width: 580px;
    }
    .notice .material-symbols-rounded { font-size: 18px; color: #c47c00; flex-shrink: 0; }

    .main-grid {
      position: relative; z-index: 1;
      max-width: 980px; margin: 0 auto 60px; padding: 0 48px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .card {
      background: var(--white); border-radius: var(--r-lg); padding: 32px;
      box-shadow: 0 8px 48px rgba(45,106,42,.07), 0 1px 4px rgba(0,0,0,.04);
      border: 1.5px solid var(--green-lt);
      display: flex; flex-direction: column; gap: 18px;
    }
    .card h2 {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em;
      display: flex; align-items: center; gap: 9px;
    }
    .card h2 .material-symbols-rounded { font-size: 22px; color: var(--green); }
    .card p { font-size: .9rem; line-height: 1.65; color: var(--text-mid); }

    .camera-wrap {
      position: relative; background: var(--green-xs);
      border-radius: var(--r-md); overflow: hidden;
      aspect-ratio: 4/3; border: 2px dashed var(--green-lt);
      display: flex; align-items: center; justify-content: center;
    }
    .camera-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .camera-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-lt); font-size: .88rem; text-align: center; padding: 20px;
    }
    .camera-placeholder .material-symbols-rounded { font-size: 40px; color: var(--green-lt); }
    #videoPreview { display: none; }
    .camera-wrap::before, .camera-wrap::after {
      content: ''; position: absolute;
      width: 24px; height: 24px;
      border-color: var(--green-mid); border-style: solid; z-index: 2;
    }
    .camera-wrap::before { top: 10px; left: 10px; border-width: 2.5px 0 0 2.5px; border-radius: 4px 0 0 0; }
    .camera-wrap::after  { bottom: 10px; right: 10px; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 4px 0; }
    canvas#snapshot { width: 100%; border-radius: var(--r-md); display: none; margin-top: 4px; }

    .upload-zone {
      border: 2px dashed var(--green-lt); border-radius: var(--r-md);
      background: var(--green-xs); padding: 28px 20px;
      text-align: center; cursor: pointer; position: relative;
      transition: border-color .18s, background .18s;
    }
    .upload-zone:hover { border-color: var(--green-mid); background: rgba(182,221,179,.18); }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-zone .material-symbols-rounded { font-size: 36px; color: var(--green-lt); margin-bottom: 8px; display: block; }
    .upload-zone p { font-size: .88rem; color: var(--text-mid); }
    .upload-zone strong { color: var(--green); }
    #uploadFileName { margin-top: 6px; font-size: .8rem; color: var(--text-lt); font-style: italic; }
    #uploadPreview { width: 100%; border-radius: var(--r-md); margin-top: 12px; display: none; object-fit: cover; max-height: 200px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 12px 24px; border-radius: var(--r-full);
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .92rem;
      cursor: pointer; border: none; text-decoration: none; width: 100%;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn .material-symbols-rounded { font-size: 18px; }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 4px 20px rgba(45,106,42,.28); }
    .btn-primary:hover:not(:disabled) { background: #256022; box-shadow: 0 8px 28px rgba(45,106,42,.38); }
    .btn .spinner {
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* progress bar for recipe generation */
    #genProgressWrap { display: none; margin-top: 8px; }
    #genProgressWrap progress {
      width: 100%; height: 5px; border-radius: var(--r-full);
      appearance: none; border: none; background: var(--green-lt);
    }
    #genProgressWrap progress::-webkit-progress-bar { background: var(--green-lt); border-radius: var(--r-full); }
    #genProgressWrap progress::-webkit-progress-value { background: var(--green); border-radius: var(--r-full); transition: width .3s; }
    #genProgressWrap p { font-size: .78rem; color: var(--text-lt); margin-top: 6px; text-align: center; }

    .result-card {
      position: relative; z-index: 1;
      max-width: 980px; margin: 0 auto 80px; padding: 0 48px;
      display: none; animation: fade-up .35s ease forwards;
    }
    @keyframes fade-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .result-inner {
      background: var(--white); border-radius: var(--r-lg); padding: 40px;
      box-shadow: 0 8px 48px rgba(45,106,42,.08), 0 1px 4px rgba(0,0,0,.04);
      border: 1.5px solid var(--green-lt);
    }
    .result-inner h3 {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 16px;
    }
    .section-label {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .76rem;
      color: var(--green); text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 10px; display: flex; align-items: center; gap: 5px; margin-top: 20px;
    }
    .section-label .material-symbols-rounded { font-size: 14px; }
    .ingredient-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .ingredient-pill {
      background: var(--green-xs); border: 1.5px solid var(--green-lt);
      border-radius: var(--r-full); padding: 5px 14px;
      font-size: .85rem; font-weight: 500; color: var(--text-mid);
    }
    .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); color: #fff;
      font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .step-text { line-height: 1.65; font-size: .93rem; }
    .result-note {
      margin-top: 20px; font-size: .83rem; color: var(--text-lt);
      padding-top: 16px; border-top: 1.5px solid var(--green-lt);
      display: flex; align-items: center; gap: 6px;
    }
    .result-note .material-symbols-rounded { font-size: 16px; color: var(--green); }
    .result-note a { color: var(--green); font-weight: 700; text-decoration: none; }
    .result-note a:hover { text-decoration: underline; }
    .error-msg {
      display: flex; align-items: center; gap: 8px;
      color: #c0440c; font-size: .93rem; margin-top: 8px;
    }
    .error-msg .material-symbols-rounded { font-size: 18px; }

    footer {
      position: relative; z-index: 1; text-align: center;
      padding: 10px 48px 48px; font-size: .83rem; color: var(--text-lt);
    }
    footer a { color: var(--green); font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      nav { padding-left: 20px; padding-right: 20px; }
      .nav-links a { padding: 6px 12px; font-size: .8rem; }
      .page-header { padding: 0 24px 28px; }
      .main-grid { grid-template-columns: 1fr; padding: 0 24px; }
      .result-card { padding: 0 24px; }
      .result-inner { padding: 28px 22px; }
    }
  </style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-circle bc1"></div>
  <div class="bg-circle bc2"></div>
  <div class="bg-circle bc3"></div>
</div>

<nav id="mainNav">
  <a href="index.html" class="logo">
    <img src="https://i.ibb.co/WNmD3Rr3/pear-1.png" alt="Pear Logo">
    Pear
  </a>
  <div class="nav-links">
    <a href="index.html">Create</a>
    <a href="scan.html" class="active">Scan</a>
    <a href="view.html">My Recipes</a>
  </div>
</nav>

<div class="page-header">
  <div class="hero-badge">
    <span class="material-symbols-rounded">photo_camera</span>
    Image Scanner
  </div>
  <h1>Take a photo, and <em>create a meal.</em></h1>
  <p>Point your camera at ingredients to see what you can make. You can also upload a photo from your device.</p>
  <div class="notice">
    <span class="material-symbols-rounded">info</span>
    To use the back camera, go to Upload an Image and select Take Photo from your device menu.
  </div>
</div>

<div class="main-grid">
  <div class="card">
    <h2><span class="material-symbols-rounded">videocam</span>Use Your Camera</h2>
    <p>Point at a dish or ingredients, then hit capture.</p>
    <div class="camera-wrap" id="cameraWrap">
      <div class="camera-placeholder" id="cameraPlaceholder">
        <span class="material-symbols-rounded">photo_camera</span>
        <span>Starting camera…</span>
      </div>
      <video id="videoPreview" autoplay playsinline></video>
    </div>
    <canvas id="snapshot"></canvas>
    <button class="btn btn-primary" onclick="captureAndScan()" id="captureBtn">
      <div class="spinner" id="captureSpinner"></div>
      <span class="material-symbols-rounded" id="captureIcon">camera</span>
      <span id="captureBtnText">Capture &amp; Scan</span>
    </button>
    <div id="genProgressWrap">
      <progress id="genProgressBar" value="0" max="100"></progress>
      <p>Generating your recipe — this takes a few seconds…</p>
    </div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-rounded">upload_file</span>Upload an Image</h2>
    <p>Select a photo from your device — Pear will analyse it and generate a recipe.</p>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="imageUpload" accept="image/*" onchange="handleFileSelect(event)">
      <span class="material-symbols-rounded">folder_open</span>
      <p><strong>Click to browse</strong> or drag &amp; drop</p>
      <p style="font-size:.8rem;color:var(--text-lt);margin-top:4px">Supports JPG, PNG, WEBP</p>
      <div id="uploadFileName"></div>
    </div>
    <img id="uploadPreview" alt="Upload preview">
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadImage()" disabled>
      <div class="spinner" id="uploadSpinner"></div>
      <span class="material-symbols-rounded" id="uploadIcon">search</span>
      <span id="uploadBtnText">Scan Uploaded Image</span>
    </button>
  </div>
</div>

<div class="result-card" id="resultCard">
  <div class="result-inner">
    <h3 id="resultTitle"></h3>
    <p id="resultDesc" style="color:var(--text-mid);line-height:1.65;margin-bottom:4px"></p>
    ${'' /* image shown after title if available */}
    <img id="resultImage" style="width:100%;border-radius:18px;margin:14px 0;display:none" alt="Recipe">
    <div class="section-label"><span class="material-symbols-rounded">nutrition</span>Ingredients</div>
    <div class="ingredient-pills" id="resultIngredients"></div>
    <div class="section-label"><span class="material-symbols-rounded">format_list_numbered</span>Steps</div>
    <div id="resultSteps"></div>
    <div class="result-note">
      <span class="material-symbols-rounded">cloud_done</span>
      Recipe saved! View it on your <a href="view.html">recipes page</a>.
    </div>
  </div>
</div>

<footer>
  Created by <a href="https://kidslearninglab.com/about">Eshaan Buddhisagar</a> ·
  Part of <a href="https://kidslearninglab.com">Kids Learning Lab</a>
</footer>

<script>
  // ── Capacitor storage helpers ──
  async function loadRecipes() {
    try {
      const { value } = await Capacitor.Plugins.Preferences.get({ key: 'pear_recipes' });
      return value ? JSON.parse(value) : [];
    } catch { return []; }
  }
  async function saveRecipe(recipe) {
    try {
      const recipes = await loadRecipes();
      const idx = recipes.findIndex(r => r.title === recipe.title);
      if (idx >= 0) recipes[idx] = recipe; else recipes.unshift(recipe);
      await Capacitor.Plugins.Preferences.set({ key: 'pear_recipes', value: JSON.stringify(recipes) });
    } catch {}
  }

  const SCAN_API  = 'https://worker-imageandtext-groq-pearaigenerator.nameless-cherry-998c.workers.dev';
  const RECIPE_API = 'https://pearai-recipe-generation-text-groq.nameless-cherry-998c.workers.dev';

  const nav = document.getElementById('mainNav');
  window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20), { passive: true });

  window.onload = async function () {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video  = document.getElementById('videoPreview');
      video.srcObject = stream;
      video.style.display = 'block';
      document.getElementById('cameraPlaceholder').style.display = 'none';
    } catch {
      document.getElementById('cameraPlaceholder').innerHTML =
        '<span class="material-symbols-rounded" style="font-size:36px;color:#e05a00">no_photography</span><span>Camera unavailable or access denied</span>';
    }
  };

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Step 1: scan image → get ingredients
  // Step 2: send ingredients to recipe worker → get full recipe + image
  async function scanAndGenerate(base64) {
    // Step 1: identify ingredients
    const scanRes  = await fetch(SCAN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 })
    });
    const scanData = await scanRes.json();
    if (scanData.error) throw new Error(scanData.error);

    const ingredients = Array.isArray(scanData.ingredients)
      ? scanData.ingredients
      : [scanData.ingredients];

    if (!ingredients.length) throw new Error('No ingredients detected in image.');

    // Step 2: generate full recipe with image
    startGenProgress();
    const recipeRes  = await fetch(RECIPE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ingredients,
        budget: 0,
        time: 30,
        serves: 2,
        meal_type: 'dish'
      })
    });
    const recipe = await recipeRes.json();
    if (recipe.error) throw new Error(recipe.error);
    return recipe;
  }

  let genProgressInterval = null;
  function startGenProgress() {
    let p = 0;
    const wrap = document.getElementById('genProgressWrap');
    const bar  = document.getElementById('genProgressBar');
    wrap.style.display = 'block';
    bar.value = 0;
    genProgressInterval = setInterval(() => { p += 6; bar.value = Math.min(p, 83); }, 300);
  }
  function stopGenProgress() {
    clearInterval(genProgressInterval);
    document.getElementById('genProgressBar').value = 100;
    setTimeout(() => { document.getElementById('genProgressWrap').style.display = 'none'; }, 400);
  }

  async function captureAndScan() {
    const video  = document.getElementById('videoPreview');
    const canvas = document.getElementById('snapshot');
    const ctx    = canvas.getContext('2d');
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.style.display = 'block';

    setLoading('capture', true);
    try {
      const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
      const recipe = await scanAndGenerate(base64);
      stopGenProgress();
      await saveRecipe({
        title: recipe.title, description: recipe.description,
        ingredients: recipe.ingredients, procedures: recipe.procedures,
        nutrition: recipe.nutrition, image: recipe.image || null,
        saved_at: new Date().toISOString()
      });
      showResult(recipe);
    } catch (err) {
      stopGenProgress();
      showError('Capture failed: ' + err.message);
    } finally {
      setLoading('capture', false);
    }
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('uploadFileName').textContent = file.name;
    document.getElementById('uploadBtn').disabled = false;
    const preview = document.getElementById('uploadPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }

  async function uploadImage() {
    const file = document.getElementById('imageUpload').files[0];
    if (!file) return alert('Please select an image.');

    setLoading('upload', true);
    try {
      const base64 = await fileToBase64(file);
      const recipe = await scanAndGenerate(base64);
      stopGenProgress();
      await saveRecipe({
        title: recipe.title, description: recipe.description,
        ingredients: recipe.ingredients, procedures: recipe.procedures,
        nutrition: recipe.nutrition, image: recipe.image || null,
        saved_at: new Date().toISOString()
      });
      showResult(recipe);
    } catch (err) {
      stopGenProgress();
      showError('Upload failed: ' + err.message);
    } finally {
      setLoading('upload', false);
    }
  }

  function showResult(data) {
    if (data.error) { showError(data.error); return; }

    document.getElementById('resultTitle').textContent = data.title;
    document.getElementById('resultDesc').textContent  = data.description || '';

    const imgEl = document.getElementById('resultImage');
    if (data.image) {
      imgEl.src = data.image;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
    }
